<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExamShield Web Mocktest</title>
<style>
/* CSS GIAO DIỆN CHUẨN TỰ ĐỘNG PHÓNG TO TRÀN VIỀN MÀN HÌNH */
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 100vw; height: 100vh; overflow: hidden; background: #f0f2f5; font-family: Arial, sans-serif; }

/* 1. MÀN HÌNH KIỂM TRA HỆ THỐNG (SYSTEM CHECK) */
#screen-check { width: 100%; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fff; padding: 20px; }
.check-box { width: 500px; padding: 30px; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
.brand-title { font-size: 24px; font-weight: bold; color: #c31e1e; margin-bottom: 5px; }
.brand-sub { font-size: 14px; color: #666; margin-bottom: 25px; }
.ready-title { font-size: 20px; font-weight: bold; color: #2e7d32; margin-top: 15px; }
.ready-desc { font-size: 14px; color: #555; margin: 10px 0 20px 0; }
.start-btn { background: #c31e1e; color: #fff; border: none; padding: 12px 35px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.2s; }
.start-btn:hover { background: #a51818; }

/* 2. GIAO DIỆN PHÒNG THI CHÍNH THỨC */
#screen-exam { width: 100%; height: 100vh; display: none; flex-direction: column; }
header { background: #fff; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #c31e1e; height: 70px; }
.logo { font-size: 22px; font-weight: bold; color: #c31e1e; }
.exam-title { font-size: 14px; color: #444; }
.timer-box { background: #c31e1e; color: #fff; padding: 8px 18px; font-weight: bold; font-size: 16px; border-radius: 4px; }
.nav-btn { background: #c31e1e; color: #fff; border: none; padding: 8px 18px; font-weight: bold; cursor: pointer; border-radius: 4px; margin-left: 10px; }
.nav-btn:disabled { background: #ccc; cursor: not-allowed; }

.main-container { display: flex; flex: 1; height: calc(100vh - 70px); overflow: hidden; width: 100%; }
sidebar { width: 220px; background: #f8f9fa; border-right: 1px solid #ddd; padding: 20px 10px; height: 100%; }
.sidebar-item { padding: 12px 15px; margin-bottom: 5px; font-size: 14px; border-radius: 4px; color: #555; font-weight: bold; }
.sidebar-item.active { background: #ffebeb; color: #c31e1e; border-left: 4px solid #c31e1e; }

#main-exam-content { flex: 1; padding: 25px; overflow-y: auto; display: flex; gap: 25px; height: 100%; background: #f0f2f5; }
.reading-text-pane { flex: 1; background: #fff; padding: 25px; border: 1px solid #ddd; border-radius: 6px; overflow-y: auto; height: calc(100vh - 120px); line-height: 1.7; text-align: left; }
.question-pane { flex: 1; background: #fff; padding: 25px; border: 1px solid #ddd; border-radius: 6px; overflow-y: auto; height: calc(100vh - 120px); text-align: left; }
.option-label { display: block; padding: 12px; margin: 12px 0; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; transition: 0.2s; font-size: 14px; }
.option-label:hover { background: #f9f9f9; }
.option-label.selected { border: 2px solid #c31e1e; background: #fff5f5; font-weight: bold; }
</style>
</head>
<body>

<!-- 1. GIAO DIỆN KIỂM TRA HỆ THỐNG -->
<div id="screen-check">
<div class="check-box">
<div class="brand-title">ExamShield</div>
<div class="brand-sub">by PeopleCert</div>
<hr style="border:0; border-top:1px solid #eee; margin:15px 0;">
<div class="ready-title">✓ Ready for the Exam</div>
<div class="ready-desc">Your computer has successfully passed the compatibility check.<br>Click the button below to start your mock exam.</div>
<button class="start-btn" onclick="vaoLamBai()">Enter Exam</button>
</div>
</div>

<!-- 2. GIAO DIỆN PHÒNG THI CHÍNH THỨC -->
<div id="screen-exam">
<header>
<div class="logo">PeopleCert</div>
<div class="exam-title">LanguageCert International ESOL B2 - Full Mocktest</div>
<div style="display: flex; align-items: center;">
<div class="timer-box" id="timer">01:00:00</div>
<button class="nav-btn btn-prev" onclick="chuyenCauHoi(-1)">Previous</button>
<button class="nav-btn btn-next" onclick="chuyenCauHoi(1)">Next</button>
</div>
</header>

<div class="main-container">
<sidebar>
<div class="sidebar-item active">▪ Reading Part 1</div>
<div class="sidebar-item">▪ Reading Part 2</div>
<div class="sidebar-item">▪ Reading Part 3</div>
<div class="sidebar-item">▪ Writing Part 1</div>
</sidebar>
<main id="main-exam-content"></main>
</div>
</div>

<script>
// CƠ SỞ DỮ LIỆU ĐỀ THI TRẮC NGHIỆM ĐỘNG
const danhSachReading = [
{
id: "r1",
part: "Reading Part 1",
title: "Monster-hunting and Cryptids",
passage: "<h3>Reading Text: Monster-hunting</h3><p style='margin-top:12px;'>Cryptids are creatures that people believe exist, but there is no official scientific proof yet. The most famous example is the Loch Ness Monster in Scotland. For decades, sonar operators and tourists have claimed to see a large shape swimming in the deep lake...</p><p style='margin-top:10px;'>Another famous cryptid is Bigfoot, a large ape-like creature said to roam the forests of North America. Many scientists argue that these stories are myths or misidentifications of real animals like bears.</p>",
options: [
"A. An animal officially proven by modern science.",
"B. A creature rumored to exist but lacks scientific proof.",
"C. An extinct species that was discovered recently."
],
correct: "B"
},
{
id: "r2",
part: "Reading Part 1",
title: "The Success of the Sports Team",
passage: "<h3>Reading Text: Team Achievement</h3><p style='margin-top:12px;'>The local women's football team has achieved incredible success this season, winning ten matches in a row. The club manager attributes this success to excellent teamwork, high discipline, and intensive tactical training sessions over the summer.</p>",
options: [
"A. some particularly talented new players joined.",
"B. the coach changed the training schedule and tactics.",
"C. team members spent more time together off the pitch."
],
correct: "B"
}
];

let viTriHienTai = 0;
let cauTraLoiThiSinh = {}; // Lưu đáp án học viên chọn

// HÀM KÍCH HOẠT KHI NHẤN NÚT ENTER EXAM
function vaoLamBai() {
// Ép kích hoạt Fullscreen toàn màn hình trình duyệt
const de = document.documentElement;
if (de.requestFullscreen) de.requestFullscreen();
else if (de.webkitRequestFullscreen) de.webkitRequestFullscreen();
else if (de.msRequestFullscreen) de.msRequestFullscreen();

// Chuyển đổi màn hình giao diện
document.getElementById('screen-check').style.display = 'none';
document.getElementById('screen-exam').style.display = 'flex';

// Vẽ câu hỏi đầu tiên
hienThiCauHoi(0);

// Chạy đồng hồ đếm ngược (60 phút)
let thoiGian = 3600;
const oDongHo = document.getElementById('timer');
const boDemGio = setInterval(function() {
if(thoiGian <= 0) {
clearInterval(boDemGio);
alert("Time is up! Your exam has ended.");
return;
}
thoiGian--;
let h = Math.floor(thoiGian / 3600);
let m = Math.floor((thoiGian % 3600) / 60);
let s = thoiGian % 60;
if(oDongHo) oDongHo.innerText = (h<10?"0"+h:h)+":"+(m<10?"0"+m:m)+":"+(s<10?"0"+s:s);
}, 1000);
}

// HÀM HIỂN THỊ CÂU HỎI VÀ BÀI ĐỌC CHIA ĐÔI MÀN HÌNH
function hienThiCauHoi(index) {
if (!danhSachReading || danhSachReading.length === 0) return;
viTriHienTai = index;
const item = danhSachReading[index];

// Ẩn/hiện nút điều hướng hợp lý
document.querySelector('.btn-prev').disabled = (index === 0);
document.querySelector('.btn-next').disabled = (index === danhSachReading.length - 1);

// Cập nhật trạng thái thanh Sidebar bên trái
const sidebarItems = document.querySelectorAll('.sidebar-item');
sidebarItems.forEach((sb, i) => {
if (i === 0) sb.classList.add('active'); // Giữ hoạt động phần Reading
});

// Vẽ nội dung vào ô Main
const mainContent = document.getElementById('main-exam-content');
if (mainContent) {
mainContent.innerHTML = `
<div class="reading-text-pane">
${item.passage}
</div>
<div class="question-pane">
<h4 style="color: #c31e1e; margin-bottom: 10px;">Question ${index + 1}:</h4>
